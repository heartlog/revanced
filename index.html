<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReVanced Release Tracker</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Load React, ReactDOM, and Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #000000; /* True black for AMOLED */
            color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // --- SVGs / Icons ---
        const WrenchIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-500">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        );

        const RefreshIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        );

        const ChevronUpIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        );

        const ChevronDownIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        );
        
        const DownloadIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        );

        const ClockIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400">
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );

        const StarIcon = ({ solid, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill={solid ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        );

        // --- Constants ---
        const CATEGORIES = ['All Apps', 'YouTube', 'Music', 'Social', 'Video', 'Photos', 'Browser', 'Productivity', 'Utility', 'Other'];
        const VERSION_TYPES = ['All Versions', 'Stable', 'Beta'];
        const VARIANTS = ['All Variants', 'ReVanced', 'Morphe', 'Extended / RVX', 'Anddea Fork'];
        const REPO_URL = 'FiorenMas/Revanced-And-Revanced-Extended-Non-Root';

        // --- Parser Logic ---
        const parseAssetInfo = (asset) => {
          const name = asset.name.toLowerCase();
          
          let appName = 'Unknown';
          let category = 'Other';
          let variant = 'ReVanced'; // Default assumption
          let versionType = 'Stable';

          // 1. Variant Detection (Improved robust matching)
          if (name.includes('-extended-') || name.includes('-rvx-') || name.includes('revanced-extended')) variant = 'Extended / RVX';
          else if (name.match(/(?:-|_|\b)morphe(?:-|_|\b)/i)) variant = 'Morphe';
          else if (name.match(/(?:-|_|\b)anddea(?:-|_|\b)/i)) variant = 'Anddea Fork';

          // 2. Version Detection
          if (name.includes('beta') || name.includes('alpha') || name.includes('dev')) versionType = 'Beta';

          // 3. App Name & Category Detection mapping
          if (name.startsWith('youtube-music') || name.startsWith('yt-music')) {
            appName = 'YouTube Music'; category = 'Music';
          } else if (name.startsWith('youtube') || name.startsWith('yt')) {
            appName = 'YouTube'; category = 'YouTube';
          } else if (name.includes('microg') || name.includes('gmscore')) {
            appName = 'MicroG / GmsCore'; category = 'Utility';
          } else if (name.startsWith('reddit')) { appName = 'Reddit'; category = 'Social'; }
          else if (name.startsWith('twitter') || name.startsWith('x-') || name.startsWith('x_')) { appName = 'Twitter / X'; category = 'Social'; }
          else if (name.startsWith('instagram')) { appName = 'Instagram'; category = 'Social'; }
          else if (name.startsWith('tiktok')) { appName = 'TikTok'; category = 'Social'; }
          else if (name.startsWith('facebook') || name.startsWith('fb-')) { appName = 'Facebook'; category = 'Social'; }
          else if (name.startsWith('messenger')) { appName = 'Messenger'; category = 'Social'; }
          else if (name.startsWith('twitch')) { appName = 'Twitch'; category = 'Video'; }
          else if (name.startsWith('bilibili')) { appName = 'Bilibili'; category = 'Video'; }
          else if (name.startsWith('lightroom')) { appName = 'Lightroom'; category = 'Photos'; }
          else if (name.startsWith('picsart')) { appName = 'Picsart'; category = 'Photos'; }
          else if (name.startsWith('photos') || name.startsWith('google-photos') || name.match(/^(?:gg)(?:-|_|\b)/i)) { 
            appName = 'Google Photos'; category = 'Photos'; 
          }
          else if (name.startsWith('chrome') || name.startsWith('brave') || name.startsWith('kiwi')) { 
            appName = name.split('-')[0].charAt(0).toUpperCase() + name.split('-')[0].slice(1); category = 'Browser'; 
          }
          else if (name.startsWith('adguard')) { appName = 'Adguard'; category = 'Utility'; }
          else if (name.startsWith('battery')) { appName = 'Battery'; category = 'Other'; }
          else {
            // Attempt generic extraction for unknown apps
            const match = name.match(/^([a-z0-9]+)(?:-[a-z0-9]+)?(?:-morphe|-revanced|-extended|-rvx|-anddea|-v\d+)/);
            if (match && match[1]) {
                appName = match[1].charAt(0).toUpperCase() + match[1].slice(1);
            } else {
                const firstSegment = name.split('-')[0];
                if(firstSegment && !firstSegment.includes('.')) {
                     appName = firstSegment.charAt(0).toUpperCase() + firstSegment.slice(1);
                } else {
                     appName = name.split('.')[0] || 'App';
                     appName = appName.charAt(0).toUpperCase() + appName.slice(1);
                }
            }
          }

          return {
            ...asset,
            parsed: { appName, category, variant, versionType }
          };
        };

        // --- Helpers ---
        const formatSize = (bytes) => {
          if (!bytes) return '0 MB';
          return (bytes / (1024 * 1024)).toFixed(1) + ' MB'; // Reduced precision for fit
        };

        const formatSizeRaw = (bytes) => {
            if (!bytes) return 0;
            return (bytes / (1024 * 1024 * 1024)).toFixed(2); // In GB
        };

        const timeAgo = (dateString) => {
          if (!dateString) return '-';
          const date = new Date(dateString);
          const now = new Date();
          const seconds = Math.floor((now - date) / 1000);
          
          let interval = seconds / 86400;
          if (interval > 1) return Math.floor(interval) + "d ago";
          interval = seconds / 3600;
          if (interval > 1) return Math.floor(interval) + "h ago";
          interval = seconds / 60;
          if (interval > 1) return Math.floor(interval) + "m ago";
          return "now";
        };

        const isRecentRelease = (dateString) => {
            if (!dateString) return false;
            const diff = new Date() - new Date(dateString);
            return diff < 3 * 24 * 60 * 60 * 1000; // Updated within the last 3 days
        };

        const formatVisitDate = (isoString) => {
            const d = new Date(isoString);
            const today = new Date();
            const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            
            if(isToday) return `Today, ${d.toLocaleTimeString(undefined, {hour: '2-digit', minute:'2-digit'})}`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
        };

        const getVariantColor = (variant) => {
            switch (variant) {
                case 'Morphe': 
                    return 'bg-blue-950/40 border-blue-800/50 text-blue-400';
                case 'Extended / RVX': 
                    return 'bg-purple-950/40 border-purple-800/50 text-purple-400';
                case 'Anddea Fork': 
                    return 'bg-orange-950/40 border-orange-800/50 text-orange-400';
                case 'ReVanced': 
                    return 'bg-cyan-950/40 border-cyan-800/50 text-cyan-400';
                default: 
                    return 'bg-[#222222] border-[#333333] text-gray-400';
            }
        };

        // --- App Group Card Component (Collapsible) ---
        const AppGroupCard = ({ group, isFavorite, onToggleFavorite }) => {
            const [isOpen, setIsOpen] = useState(true);

            return (
                <div className={`bg-[#111111] border rounded-xl overflow-hidden transition-all duration-300 ${isFavorite ? 'border-yellow-600/30 shadow-[0_0_15px_rgba(202,138,4,0.05)]' : 'border-[#222222]'}`}>
                    {/* App Header */}
                    <div className="flex items-center justify-between p-4 md:p-5 hover:bg-[#161616] transition-colors select-none group/header">
                        
                        {/* Title & Category Info (Click to toggle expand) */}
                        <div className="flex-1 cursor-pointer flex flex-col" onClick={() => setIsOpen(!isOpen)}>
                            <h2 className="text-xl font-medium text-gray-100 flex items-center gap-2">
                                {group.appName}
                                <span className="px-2 py-0.5 bg-[#222222] rounded-full text-[9px] text-gray-400 lowercase tracking-wider border border-[#333]">
                                    {group.category}
                                </span>
                            </h2>
                            <p className="text-xs text-gray-500 mt-1">{group.files.length} release{group.files.length > 1 ? 's' : ''} available</p>
                        </div>
                        
                        {/* Actions: Favorite & Expand */}
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={(e) => { e.stopPropagation(); onToggleFavorite(group.appName); }}
                                className="p-2 rounded-lg hover:bg-[#222] transition-colors"
                                title="Toggle Favorite"
                            >
                                <StarIcon solid={isFavorite} className={isFavorite ? "text-yellow-500 drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]" : "text-gray-500"} />
                            </button>
                            <div className="text-gray-500 group-hover/header:text-gray-300 bg-[#1a1a1a] p-2 rounded-lg border border-[#333] cursor-pointer" onClick={() => setIsOpen(!isOpen)}>
                                {isOpen ? <ChevronUpIcon /> : <ChevronDownIcon />}
                            </div>
                        </div>
                    </div>

                    {/* Collapsible Content */}
                    {isOpen && (
                        <div className="px-3 md:px-5 pb-3 md:pb-5">
                            {/* Flex Table Header - Adjusted Widths for Mobile */}
                            <div className="flex w-full items-center gap-1 md:gap-2 pb-3 border-b border-[#2a2a2a] text-[9px] md:text-xs text-gray-500 font-medium px-1">
                                <div className="flex-1 min-w-0 uppercase tracking-wider">File Name</div>
                                <div className="w-[55px] md:w-[85px] text-center uppercase tracking-wider">Variant</div>
                                <div className="w-[30px] md:w-[60px] text-center uppercase tracking-wider">Vers.</div>
                                <div className="w-[45px] md:w-[65px] text-right uppercase tracking-wider">Size</div>
                                <div className="w-[42px] md:w-[65px] text-right uppercase tracking-wider">Date</div>
                                <div className="w-[16px] md:w-[24px]"></div>
                            </div>

                            {/* Flex Table Body */}
                            <div className="divide-y divide-[#222222]">
                                {group.files.map(file => (
                                    <a 
                                        key={file.id} 
                                        href={file.browser_download_url}
                                        className="flex w-full items-center gap-1 md:gap-2 py-3 md:py-4 hover:bg-[#1a1a1a] transition-colors group cursor-pointer px-1"
                                        title="Click to Download APK"
                                    >
                                        {/* File Name (Takes Remaining Space) */}
                                        <div className="flex-1 min-w-0 text-cyan-600 group-hover:text-cyan-400 text-[10px] md:text-[13px] break-all font-mono leading-tight flex flex-wrap items-start gap-1">
                                            {file.name}
                                            {isRecentRelease(file.updated_at) && (
                                                <span className="inline-block w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse mt-0.5 flex-shrink-0 shadow-[0_0_5px_rgba(34,197,94,0.8)]" title="Recently Updated"></span>
                                            )}
                                        </div>
                                        
                                        {/* Variant Badge */}
                                        <div className="w-[55px] md:w-[85px] flex justify-center flex-shrink-0">
                                            <span className={`px-1 py-0.5 border rounded text-[9px] md:text-[11px] truncate w-full text-center ${getVariantColor(file.parsed.variant)}`}>
                                                {file.parsed.variant}
                                            </span>
                                        </div>

                                        {/* Version Type */}
                                        <div className="w-[30px] md:w-[60px] text-center text-[9px] md:text-sm text-gray-400 flex-shrink-0">
                                            {file.parsed.versionType}
                                        </div>

                                        {/* Size */}
                                        <div className="w-[45px] md:w-[65px] text-right text-[9px] md:text-sm text-gray-400 flex-shrink-0">
                                            {formatSize(file.size)}
                                        </div>

                                        {/* Updated Date */}
                                        <div className="w-[42px] md:w-[65px] text-right text-[9px] md:text-sm text-gray-400 flex-shrink-0">
                                            {timeAgo(file.updated_at)}
                                        </div>

                                        {/* Download Icon */}
                                        <div className="w-[16px] md:w-[24px] flex justify-end flex-shrink-0 text-cyan-600 group-hover:text-cyan-400 transition-colors">
                                            <DownloadIcon />
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main Component ---
        function App() {
          const [assets, setAssets] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);
          const [refreshing, setRefreshing] = useState(false);
          const [pastVisits, setPastVisits] = useState([]);
          const [favorites, setFavorites] = useState(() => {
              try { return JSON.parse(localStorage.getItem('revanced_tracker_favs')) || []; }
              catch { return []; }
          });

          // Filters
          const [searchTerm, setSearchTerm] = useState('');
          const [activeCategory, setActiveCategory] = useState('All Apps');
          const [activeVersionType, setActiveVersionType] = useState('All Versions');
          const [activeVariant, setActiveVariant] = useState('All Variants');

          // Visit Tracking Logic (Local Storage)
          useEffect(() => {
              const VISITS_KEY = 'revanced_tracker_visits';
              const now = new Date();
              
              let visits = [];
              try {
                  const stored = localStorage.getItem(VISITS_KEY);
                  if (stored) visits = JSON.parse(stored);
              } catch (e) {
                  console.error("Error reading past visits", e);
              }

              // Only log a new visit if the last visit was more than 30 minutes ago
              const shouldLogVisit = visits.length === 0 || (now - new Date(visits[0])) > 30 * 60 * 1000;
              
              let updatedVisits = [...visits];
              
              if (shouldLogVisit) {
                  // Add the new visit and keep only the top 3
                  updatedVisits = [now.toISOString(), ...updatedVisits].slice(0, 3);
                  localStorage.setItem(VISITS_KEY, JSON.stringify(updatedVisits));
              }
              
              // Set state with the updated list so it renders immediately
              setPastVisits(updatedVisits);
          }, []);

          // Fetch Data
          const fetchReleases = async (isManualRefresh = false) => {
            if (isManualRefresh) setRefreshing(true);
            else setLoading(true);
            
            setError(null);
            try {
              const response = await fetch(`https://api.github.com/repos/${REPO_URL}/releases/latest`);
              
              if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);
              
              const releaseData = await response.json();
              
              if (releaseData && releaseData.assets) {
                const parsedAssets = releaseData.assets.map(parseAssetInfo);
                setAssets(parsedAssets);
              } else {
                 setAssets([]);
              }
            } catch (err) {
              setError(err.message);
            } finally {
              setLoading(false);
              setRefreshing(false);
            }
          };

          useEffect(() => {
            fetchReleases();
          }, []);

          // Toggle Favorite Handler
          const toggleFavorite = (appName) => {
              let newFavorites;
              if (favorites.includes(appName)) {
                  newFavorites = favorites.filter(fav => fav !== appName);
              } else {
                  newFavorites = [...favorites, appName];
              }
              setFavorites(newFavorites);
              localStorage.setItem('revanced_tracker_favs', JSON.stringify(newFavorites));
          };

          // Process data based on filters
          const processedData = useMemo(() => {
            // 1. Filter
            const filtered = assets.filter(asset => {
              const { parsed } = asset;
              const matchSearch = asset.name.toLowerCase().includes(searchTerm.toLowerCase()) || parsed.appName.toLowerCase().includes(searchTerm.toLowerCase());
              const matchCategory = activeCategory === 'All Apps' || parsed.category === activeCategory;
              const matchVersion = activeVersionType === 'All Versions' || parsed.versionType === activeVersionType;
              const matchVariant = activeVariant === 'All Variants' || parsed.variant === activeVariant;
              
              return matchSearch && matchCategory && matchVersion && matchVariant;
            });

            // 2. Group by App Name
            const grouped = filtered.reduce((acc, asset) => {
              const appName = asset.parsed.appName;
              if (!acc[appName]) {
                acc[appName] = { category: asset.parsed.category, files: [] };
              }
              acc[appName].files.push(asset);
              return acc;
            }, {});

            // Sort files within groups (newest first)
            Object.keys(grouped).forEach(key => {
                grouped[key].files.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            });

            // Sort groups: Favorites first, then alphabetical
            const sortedGroupKeys = Object.keys(grouped).sort((a, b) => {
                const isAFav = favorites.includes(a);
                const isBFav = favorites.includes(b);
                
                if (isAFav && !isBFav) return -1;
                if (!isAFav && isBFav) return 1;
                return a.localeCompare(b);
            });
            
            return {
                filteredCount: filtered.length,
                grouped: sortedGroupKeys.map(key => ({ appName: key, ...grouped[key] })),
                rawFiltered: filtered
            };
          }, [assets, searchTerm, activeCategory, activeVersionType, activeVariant, favorites]);

          // Calculate Stats
          const stats = useMemo(() => {
            const raw = processedData.rawFiltered;
            const totalFiles = raw.length;
            const totalSizeBytes = raw.reduce((sum, asset) => sum + asset.size, 0);
            const totalSizeGB = formatSizeRaw(totalSizeBytes);
            
            let newestDate = null;
            if (raw.length > 0) {
              const dates = raw.map(a => new Date(a.updated_at));
              newestDate = new Date(Math.max.apply(null, dates));
            }

            return {
              files: totalFiles,
              size: `${totalSizeGB} GB`,
              updated: newestDate ? timeAgo(newestDate.toISOString()) : '-',
              apps: processedData.grouped.length
            };
          }, [processedData]);

          const FilterButton = ({ active, label, onClick }) => (
            <button
              onClick={onClick}
              className={`px-3 py-1.5 rounded text-sm font-medium transition-colors ${
                active 
                  ? 'bg-cyan-500 text-black' 
                  : 'bg-transparent text-gray-300 border border-[#333] hover:bg-[#1a1a1a]'
              }`}
            >
              {label}
            </button>
          );

          return (
            <div className="min-h-screen bg-[#000000] text-gray-200 font-sans selection:bg-cyan-500/30 pb-20">
              
              <main className="max-w-3xl mx-auto px-4 pt-8 space-y-6">
                
                {/* Header Section */}
                <div className="text-center space-y-2 mb-8">
                    <h1 className="text-2xl font-semibold flex items-center justify-center gap-3">
                        <WrenchIcon />
                        ReVanced Release Tracker
                    </h1>
                    <p className="text-gray-500 text-sm">
                        Track releases from <a href={`https://github.com/${REPO_URL}`} target="_blank" rel="noreferrer" className="text-cyan-600 hover:text-cyan-400">FiorenMas/Revanced-And-Revanced-Extended-Non-Root</a>
                    </p>
                </div>

                {/* Filters Card */}
                <div className="bg-[#111111] border border-[#222222] rounded-xl p-4 md:p-5">
                    
                    <div className="space-y-3 mb-6">
                        <input 
                            type="text" 
                            placeholder="Search apps, APK names, variants..." 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-cyan-500/50 transition-all placeholder-gray-500"
                        />
                        <button 
                            onClick={() => fetchReleases(true)}
                            className="w-full bg-[#1a1a1a] hover:bg-[#222] border border-[#333] rounded-lg py-2.5 text-sm flex items-center justify-center gap-2 transition-colors"
                        >
                            <RefreshIcon className={`w-4 h-4 ${refreshing ? 'animate-spin' : ''}`} />
                            Refresh Data
                        </button>

                        {/* Recent Visits Tracker - Now properly updates on mount */}
                        {pastVisits.length > 0 && (
                            <div className="flex flex-col gap-2 pt-2">
                                <div className="text-[10px] text-gray-500 uppercase tracking-widest flex items-center gap-1.5 ml-1">
                                    <ClockIcon /> Past Visits
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {pastVisits.map((visit, idx) => (
                                        <span key={idx} className="text-[11px] text-gray-400 bg-[#1a1a1a] px-2.5 py-1 rounded-md border border-[#2a2a2a]">
                                            {formatVisitDate(visit)}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Filter Groups */}
                    <div className="space-y-5 border-t border-[#222] pt-5">
                        <div>
                            <h3 className="text-xs font-medium text-gray-500 tracking-wider mb-2.5 uppercase">App Category</h3>
                            <div className="flex flex-wrap gap-2">
                                {CATEGORIES.map(cat => (
                                    <FilterButton key={cat} label={cat} active={activeCategory === cat} onClick={() => setActiveCategory(cat)} />
                                ))}
                            </div>
                        </div>

                        <div>
                            <h3 className="text-xs font-medium text-gray-500 tracking-wider mb-2.5 uppercase">Version Type</h3>
                            <div className="flex flex-wrap gap-2">
                                {VERSION_TYPES.map(type => (
                                    <FilterButton key={type} label={type} active={activeVersionType === type} onClick={() => setActiveVersionType(type)} />
                                ))}
                            </div>
                        </div>

                        <div>
                            <h3 className="text-xs font-medium text-gray-500 tracking-wider mb-2.5 uppercase">Variant</h3>
                            <div className="flex flex-wrap gap-2">
                                {VARIANTS.map(variant => (
                                    <FilterButton key={variant} label={variant} active={activeVariant === variant} onClick={() => setActiveVariant(variant)} />
                                ))}
                            </div>
                        </div>
                    </div>
                </div>

                {/* Stats Grid */}
                <div className="grid grid-cols-2 gap-3 md:gap-4">
                    {[
                        { label: 'Total Files', value: stats.files },
                        { label: 'Total Size', value: stats.size },
                        { label: 'Last Updated', value: stats.updated },
                        { label: 'Apps Available', value: stats.apps },
                    ].map((stat, i) => (
                        <div key={i} className="bg-[#111111] border border-[#222222] rounded-xl p-5 flex flex-col items-center justify-center text-center">
                            <div className={`text-3xl md:text-4xl font-light mb-1 text-cyan-500`}>
                                {loading ? '-' : stat.value}
                            </div>
                            <div className="text-xs text-gray-500">{stat.label}</div>
                        </div>
                    ))}
                </div>

                {/* Loading / Error States */}
                {error && (
                    <div className="bg-red-950/30 border border-red-900/50 text-red-400 p-4 rounded-xl text-sm text-center">
                        {error}
                    </div>
                )}
                
                {loading && !refreshing && (
                     <div className="text-center py-10 text-gray-500 text-sm animate-pulse">
                        Loading repository data...
                     </div>
                )}

                {!loading && processedData.grouped.length === 0 && !error && (
                    <div className="text-center py-12 text-gray-500 bg-[#111111] border border-[#222222] rounded-xl">
                        No releases found matching your criteria.
                    </div>
                )}

                {/* List Section */}
                {!loading && (
                    <div className="space-y-4">
                        {processedData.grouped.map((group) => (
                            <AppGroupCard 
                                key={group.appName} 
                                group={group} 
                                isFavorite={favorites.includes(group.appName)}
                                onToggleFavorite={toggleFavorite}
                            />
                        ))}
                    </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
